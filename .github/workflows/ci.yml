# CI gate for every push and pull request.
#
# Any job failing here fails the workflow, so a change that does not
# format, vet, lint, test, or build on Linux / macOS / Windows cannot
# land as a green check. fail-fast is off so you see every broken
# platform, not just the first one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module graph
        run: |
          go mod verify
          go mod tidy -diff

      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -race needs a C compiler. GitHub's Windows image does not ship
      # one, so Windows still compiles and runs every test — just
      # without the race detector.
      - name: go test
        run: go test ./... ${{ runner.os != 'Windows' && '-race' || '' }} -count=1 -timeout 5m

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dbwatch
        run: go build -trimpath ./cmd/dbwatch

      - name: Build dbwatch-test
        run: go build -trimpath ./test/cmd/dbwatch-test

  cross-compile:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same targets as `make dist`: linux/darwin/windows × amd64/arm64
      # (windows/arm64 is not a shipped target). A compile error on any
      # pair fails this job and therefore the workflow.
      - name: make dist
        run: make dist

  # Single required check: GitHub branch protection can watch this job
  # instead of listing every matrix cell.
  ci-ok:
    name: CI
    if: always()
    needs: [static, test, build, cross-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          echo "static=${{ needs.static.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          echo "cross-compile=${{ needs.cross-compile.result }}"
          [ "${{ needs.static.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.cross-compile.result }}" = "success" ]
