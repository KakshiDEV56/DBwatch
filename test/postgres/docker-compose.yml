services:
  postgres:
    image: postgres:16-alpine
    container_name: dbwatch-test-pg
    environment:
      POSTGRES_PASSWORD: dbwatch
      POSTGRES_DB: dbwatch_test_production
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # Kept low deliberately -- the connection-pressure scenario is meant
      # to threaten this ceiling without threatening the host machine.
      - -c
      - max_connections=120
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
